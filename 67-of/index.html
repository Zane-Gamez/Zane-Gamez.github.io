<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zane Gamez</title>

    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tab-bar {
            display: flex;
            align-items: center;
            background: #0a0a0a;
            padding: 6px 10px 0;
            border-bottom: 1px solid #240046;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            min-height: 48px;
        }

        .tab-bar::-webkit-scrollbar {
            display: none;
        }

        .back-home {
            color: #666;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 6px;
            transition: .2s;
            white-space: nowrap;
        }

        .back-home:hover {
            color: #fff;
            background: #111;
        }

        .tab {
            display: flex;
            align-items: center;
            background: #111;
            padding: 8px 14px;
            border-radius: 10px 10px 0 0;
            font-size: 13px;
            cursor: pointer;
            min-width: 130px;
            max-width: 220px;
            border: 1px solid #1f1f1f;
            border-bottom: none;
            transition: .2s;
            position: relative;
            color: #888;
            user-select: none;
        }

        .tab:hover {
            background: #161616;
            color: #ddd;
        }

        .tab.active {
            background: #9d4edd;
            color: #fff;
            border-color: #9d4edd;
            box-shadow: 0 -4px 18px rgba(157, 78, 237, .25);
        }

        .tab-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab-close {
            margin-left: 10px;
            font-size: 14px;
            opacity: .55;
            transition: .2s;
        }

        .tab-close:hover {
            opacity: 1;
            color: #ff5b5b;
        }

        .toolbar-btn {
            background: rgba(157, 78, 237, .08);
            border: 1px solid rgba(157, 78, 237, .25);
            color: #9d4edd;
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 6px;
            font-weight: 700;
            transition: .2s;
            white-space: nowrap;
        }

        .toolbar-btn:hover {
            background: #9d4edd;
            color: #fff;
            box-shadow: 0 0 12px rgba(157, 78, 237, .5);
        }

        .spacer {
            flex: 1;
        }

        .address-bar-container {
            display: flex;
            padding: 10px;
            background: #0a0a0a;
            gap: 10px;
            border-bottom: 1px solid #111;
        }

        #bar {
            flex: 1;
            background: #111;
            border: 1px solid #222;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            outline: none;
            transition: .2s;
            font-size: 14px;
        }

        #bar:focus {
            border-color: #9d4edd;
            box-shadow: 0 0 10px rgba(157, 78, 237, .2);
        }

        .nav-btn {
            background: #1b1b1b;
            border: 1px solid #2a2a2a;
            color: #fff;
            padding: 0 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: .2s;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: #292929;
        }

        .go-btn {
            background: #9d4edd;
            border: none;
        }

        .go-btn:hover {
            background: #b05cff;
        }

        #viewport-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            inset: 0;
            display: none;
            background: #000;
        }

        iframe.active {
            display: block;
        }

        .settings-panel {
            position: fixed;
            top: 58px;
            right: 12px;
            width: 320px;
            background: #0d0d0d;
            border: 1px solid #232323;
            border-radius: 14px;
            padding: 16px;
            z-index: 9999;
            display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .55);
        }

        .settings-panel.open {
            display: block;
        }

        .settings-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .settings-group {
            margin-bottom: 14px;
        }

        .settings-label {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
            display: block;
        }

        .settings-input,
        .settings-select {
            width: 100%;
            background: #111;
            border: 1px solid #222;
            color: #fff;
            border-radius: 8px;
            padding: 10px 12px;
            outline: none;
        }

        .settings-save {
            width: 100%;
            background: #9d4edd;
            border: none;
            color: #fff;
            padding: 11px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: .2s;
        }

        .settings-save:hover {
            background: #b05cff;
        }
    </style>
</head>

<body>

    <div class="tab-bar" id="tab-bar">
        <a href="/porxy-selector" class="back-home">Select Proxy</a>

        <button class="toolbar-btn" onclick="addTab()">+</button>

        <div class="spacer"></div>

        <button class="toolbar-btn" onclick="toggleSettings()">Settings</button>
    </div>

    <div class="address-bar-container">
        <button class="nav-btn" onclick="goBack()">←</button>
        <button class="nav-btn" onclick="goForward()">→</button>

        <input type="text" id="bar" placeholder="Search or enter URL">

        <button class="nav-btn go-btn" onclick="nav()">GO</button>
    </div>

    <div id="viewport-container"></div>

    <div class="settings-panel" id="settings-panel">
        <div class="settings-title">Settings</div>

        <div class="settings-group">
            <label class="settings-label">WebSocket Server</label>

            <select id="ws-select" class="settings-select">
                <option value="default">Default Classroom</option>
                <option value="wss://echo.websocket.events">Echo</option>
                <option value="wss://ws.ifelse.io">IfElse</option>
                <option value="custom">Custom</option>
            </select>
        </div>

        <div class="settings-group">
            <label class="settings-label">Custom WebSocket</label>

            <input type="text" id="custom-ws" class="settings-input"
                placeholder="wss://example.com/wisp/">
        </div>

        <button class="settings-save" onclick="saveSettings()">
            Save Settings
        </button>
    </div>

    <script>
        const tabBar = document.getElementById("tab-bar");
        const bar = document.getElementById("bar");
        const viewportContainer = document.getElementById("viewport-container");

        let tabs = [];
        let activeTabId = null;

        const defaultWs =
            location.protocol === "https:"
                ? "wss://classroom.lat/"
                : "ws://classroom.lat/";

        let currentWs =
            localStorage.getItem("proxy-ws") ||
            defaultWs;

        navigator.serviceWorker.register("/sail/sw.js");

        const connection = new BareMux.BareMuxConnection("/sail/baremux/worker.js");

        async function applyTransport() {
            await connection.setTransport("/sail/libcurl/index.mjs", [
                { websocket: currentWs }
            ]);
        }

        applyTransport();

        const { ScramjetController } = $scramjetLoadController();

        const scramjet = new ScramjetController({
            files: {
                all: "/sail/scram/scramjet.all.js",
                wasm: "/sail/scram/scramjet.wasm.wasm",
                sync: "/sail/scram/scramjet.sync.js"
            },
            prefix: "/sail/go/"
        });

        scramjet.init();

        function toggleSettings() {
            document.getElementById("settings-panel").classList.toggle("open");
        }

        function saveSettings() {
            const selected = document.getElementById("ws-select").value;
            const custom = document.getElementById("custom-ws").value.trim();

            if (selected === "default") {
                currentWs = defaultWs;
            } else if (selected === "custom") {
                if (!custom) return;
                currentWs = custom;
            } else {
                currentWs = selected;
            }

            localStorage.setItem("proxy-ws", currentWs);

            applyTransport();

            toggleSettings();
        }

        function getNewTabPage() {
            return scramjet.encodeUrl("https://math-hub.pages.dev/newtab/");
        }

        function addTab(url = "internal:newtab") {
            const id = "tab-" + crypto.randomUUID();

            const tabObj = {
                id,
                title: "New Tab",
                url
            };

            tabs.push(tabObj);

            const tabEl = document.createElement("div");

            tabEl.className = "tab";
            tabEl.id = "btn-" + id;

            tabEl.innerHTML = `
                <span class="tab-title">New Tab</span>
                <span class="tab-close">×</span>
            `;

            tabEl.onclick = () => switchTab(id);

            tabEl.querySelector(".tab-close").onclick = (e) => {
                closeTab(e, id);
            };

            tabBar.insertBefore(
                tabEl,
                document.querySelector(".spacer")
            );

            const iframe = document.createElement("iframe");

            iframe.id = "frame-" + id;

            if (url === "internal:newtab") {
                iframe.src = getNewTabPage();
            } else {
                iframe.src = scramjet.encodeUrl(formatUrl(url));
            }

            iframe.addEventListener("load", () => {
                updateTabTitle(id);
            });

            viewportContainer.appendChild(iframe);

            switchTab(id);
        }

        function switchTab(id) {
            activeTabId = id;

            tabs.forEach(tab => {
                const btn = document.getElementById("btn-" + tab.id);
                const frame = document.getElementById("frame-" + tab.id);

                const active = tab.id === id;

                btn.classList.toggle("active", active);
                frame.classList.toggle("active", active);

                if (active) {
                    bar.value =
                        tab.url === "internal:newtab"
                            ? ""
                            : tab.url;
                }
            });
        }

        function closeTab(event, id) {
            event.stopPropagation();

            if (tabs.length === 1) return;

            const index = tabs.findIndex(t => t.id === id);

            document.getElementById("btn-" + id)?.remove();
            document.getElementById("frame-" + id)?.remove();

            tabs.splice(index, 1);

            if (activeTabId === id) {
                const next = tabs[index] || tabs[index - 1];

                if (next) {
                    switchTab(next.id);
                }
            }
        }

        function formatUrl(url) {
            if (!url) return "";

            if (
                !url.startsWith("http://") &&
                !url.startsWith("https://")
            ) {
                if (url.includes(".")) {
                    return "https://" + url;
                }

                return "https://search.brave.com/search?q=" +
                    encodeURIComponent(url);
            }

            return url;
        }

        function nav() {
            if (!activeTabId) return;

            const value = bar.value.trim();

            if (!value) return;

            const formatted = formatUrl(value);

            const tab = tabs.find(t => t.id === activeTabId);

            tab.url = formatted;

            const frame =
                document.getElementById("frame-" + activeTabId);

            frame.src = scramjet.encodeUrl(formatted);

            updateTabTitle(activeTabId, formatted);
        }

        function updateTabTitle(id, fallback = "Loading...") {
            const frame = document.getElementById("frame-" + id);

            let title = fallback;

            try {
                title =
                    frame.contentDocument?.title ||
                    new URL(tabs.find(t => t.id === id)?.url || "")
                        .hostname ||
                    fallback;
            } catch {
                try {
                    title = new URL(
                        tabs.find(t => t.id === id)?.url || ""
                    ).hostname;
                } catch {
                    title = fallback;
                }
            }

            document.querySelector(
                `#btn-${id} .tab-title`
            ).textContent = title;
        }

        function goBack() {
            if (!activeTabId) return;

            document
                .getElementById("frame-" + activeTabId)
                ?.contentWindow
                ?.history
                ?.back();
        }

        function goForward() {
            if (!activeTabId) return;

            document
                .getElementById("frame-" + activeTabId)
                ?.contentWindow
                ?.history
                ?.forward();
        }

        bar.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                nav();
            }
        });

        window.addEventListener("load", () => {
            const params = new URLSearchParams(location.search);

            const go = params.get("go");

            addTab(go || "internal:newtab");
        });
    </script>

</body>

</html>
