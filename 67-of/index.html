<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxProxy</title>

    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #000000;
            --toolbar: #0d0d0d;
            --toolbar2: #111111;
            --tab: #0f0f0f;
            --tab-hover: #1b1b1b;
            --border: #1f1f1f;
            --text: #ffffff;
            --muted: #8a8a8a;
            --active: #1c1c1c;
        }

        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tab-bar {
            height: 36px;
            background: var(--toolbar);
            display: flex;
            align-items: flex-end;
            padding: 0 8px;
            gap: 6px;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            height: 34px;
            min-width: 190px;
            max-width: 220px;
            background: var(--tab);
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            cursor: pointer;
            color: #cfcfcf;
            user-select: none;
            transition: .15s;
        }

        .tab:hover {
            background: var(--tab-hover);
        }

        .tab.active {
            background: #111111;
        }

        .tab-title {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        .tab-close {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar {
            height: 52px;
            background: black;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
        }

        .address-bar {
            flex: 1;
            height: 34px;
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 12px;
        }

        #bar {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
        }

        #viewport-container {
            flex: 1;
            position: relative;
            background: black;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }
    </style>
</head>

<body>

    <div class="tab-bar" id="tab-bar">
        <button onclick="addTab()">+</button>
    </div>

    <div class="navbar">
        <div class="address-bar">
            <input id="bar" type="text">
        </div>
    </div>

    <div id="viewport-container"></div>

    <script>
        const tabBar = document.getElementById("tab-bar");
        const bar = document.getElementById("bar");
        const viewportContainer = document.getElementById("viewport-container");

        let tabs = [];
        let activeTabId = null;

        function decodeProxiedUrl(u) {
            if (!u) return "";

            try {
                if (u.includes("/sail/go/")) {
                    let part = u.split("/sail/go/")[1] || "";

                    while (part.includes("%")) {
                        const next = decodeURIComponent(part);
                        if (next === part) break;
                        part = next;
                    }

                    return part;
                }

                return u;
            } catch {
                return u;
            }
        }

        function getRealFrameUrl(frame) {
            try {
                let url = "";

                try {
                    url = frame.contentWindow.location.href;
                } catch {
                    url = frame.src;
                }

                if (!url) return "";

                return decodeProxiedUrl(url);
            } catch {
                return frame.src;
            }
        }

        function addTab(url = "bloxcraft://newtab") {
            const id = "tab-" + crypto.randomUUID();

            const tab = { id, url };
            tabs.push(tab);

            const el = document.createElement("div");
            el.className = "tab";
            el.id = "btn-" + id;

            el.innerHTML = `
                <div class="tab-title">New Tab</div>
                <div class="tab-close">×</div>
            `;

            el.onclick = () => switchTab(id);
            el.querySelector(".tab-close").onclick = (e) => closeTab(e, id);

            tabBar.appendChild(el);

            const frame = document.createElement("iframe");
            frame.id = "frame-" + id;
            frame.src = url;

            viewportContainer.appendChild(frame);

            switchTab(id);
        }

        function switchTab(id) {
            activeTabId = id;

            tabs.forEach(t => {
                const btn = document.getElementById("btn-" + t.id);
                const frame = document.getElementById("frame-" + t.id);

                const active = t.id === id;

                btn.classList.toggle("active", active);
                frame.classList.toggle("active", active);
            });

            syncBar();
        }

        function syncBar() {
            const frame = document.getElementById("frame-" + activeTabId);
            if (!frame) return;

            bar.value = getRealFrameUrl(frame);
        }

        function nav() {
            const tab = tabs.find(t => t.id === activeTabId);
            if (!tab) return;

            const frame = document.getElementById("frame-" + activeTabId);

            let url = bar.value;

            if (!url.startsWith("http")) {
                url = "https://" + url;
            }

            tab.url = url;
            frame.src = url;

            setTimeout(syncBar, 300);
        }

        function closeTab(e, id) {
            e.stopPropagation();

            document.getElementById("btn-" + id)?.remove();
            document.getElementById("frame-" + id)?.remove();

            tabs = tabs.filter(t => t.id !== id);

            if (activeTabId === id && tabs.length) {
                switchTab(tabs[0].id);
            }
        }

        bar.addEventListener("keydown", e => {
            if (e.key === "Enter") nav();
        });

        setInterval(syncBar, 400);

        addTab("https://math-hub.pages.dev/newtab/");
    </script>

</body>
</html>
