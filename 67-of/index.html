<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxProxy</title>

    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #000000;
            --toolbar: #0d0d0d;
            --toolbar2: #111111;
            --tab: #0f0f0f;
            --tab-hover: #1b1b1b;
            --border: #1f1f1f;
            --text: #ffffff;
            --muted: #8a8a8a;
            --active: #1c1c1c;
        }

        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tab-bar {
            height: 36px;
            background: var(--toolbar);
            display: flex;
            align-items: flex-end;
            padding: 0 8px;
            gap: 6px;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            height: 34px;
            min-width: 190px;
            max-width: 220px;
            background: var(--tab);
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            cursor: pointer;
            color: #cfcfcf;
            user-select: none;
            transition: .15s;
        }

        .tab:hover {
            background: var(--tab-hover);
        }

        .tab.active {
            background: #111111;
        }

        .tab-icon {
            width: 14px;
            height: 14px;
            opacity: .9;
        }

        .tab-icon svg {
            width: 100%;
            height: 100%;
            fill: white;
        }

        .tab-title {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        .tab-close {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: .15s;
        }

        .tab-close:hover {
            background: rgba(255, 255, 255, .12);
        }

        .new-tab-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            color: white;
            font-size: 22px;
            cursor: pointer;
            border-radius: 8px;
            transition: .15s;
        }

        .new-tab-btn:hover {
            background: #1a1a1a;
        }

        .navbar {
            height: 52px;
            background: black;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
        }

        .nav-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .15s;
        }

        .nav-btn:hover {
            background: #1d1d1d;
        }

        .nav-btn svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        .address-bar {
            flex: 1;
            height: 34px;
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
        }

        .lock-icon {
            width: 14px;
            height: 14px;
            opacity: .9;
        }

        .lock-icon svg {
            width: 100%;
            height: 100%;
            fill: #3ddc84;
        }

        #bar {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 14px;
        }

        .bookmarks-bar {
            height: 30px;
            background: black;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 10px;
            overflow-x: auto;
        }

        .bookmark {
            color: #cfcfcf;
            text-decoration: none;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: .15s;
            white-space: nowrap;
        }

        .bookmark:hover {
            background: #1b1b1b;
        }

        .bookmark-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .bookmark-remove {
            width: 18px;
            height: 18px;
            border: none;
            background: transparent;
            color: #777;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            transition: .15s;
        }

        .bookmark-remove:hover {
            background: #1f1f1f;
            color: white;
        }

        .add-bookmark-btn {
            border: none;
            background: transparent;
            color: #cfcfcf;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            transition: .15s;
        }

        .add-bookmark-btn:hover {
            background: #1b1b1b;
        }

        #viewport-container {
            flex: 1;
            position: relative;
            background: black;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            background: black;
        }

        iframe.active {
            display: block;
        }

        .settings-panel {
            position: fixed;
            top: 50px;
            right: 10px;
            width: 320px;
            background: #111111;
            border: 1px solid #242424;
            border-radius: 14px;
            padding: 16px;
            display: none;
            z-index: 9999;
        }

        .settings-panel.open {
            display: block;
        }

        .settings-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .settings-label {
            font-size: 13px;
            color: #b5b5b5;
            margin-bottom: 8px;
            display: block;
        }

        .settings-select,
        .settings-input {
            width: 100%;
            height: 42px;
            background: #0b0b0b;
            border: 1px solid #262626;
            border-radius: 10px;
            color: white;
            padding: 0 12px;
            outline: none;
            margin-bottom: 14px;
        }

        #custom-ws-group {
            display: none;
        }

        .settings-save {
            width: 100%;
            height: 42px;
            border: none;
            background: white;
            color: black;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="tab-bar" id="tab-bar">

        <button class="new-tab-btn" onclick="addTab()">
            +
        </button>

    </div>

    <div class="navbar">

        <button class="nav-btn" onclick="goBack()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                <path d="M73.4 297.4C60.9 309.9 60.9 330.2 73.4 342.7L233.4 502.7C245.9 515.2 266.2 515.2 278.7 502.7C291.2 490.2 291.2 469.9 278.7 457.4L173.3 352L544 352C561.7 352 576 337.7 576 320C576 302.3 561.7 288 544 288L173.3 288L278.7 182.6C291.2 170.1 291.2 149.8 278.7 137.3C266.2 124.8 245.9 124.8 233.4 137.3L73.4 297.3z"/>
            </svg>
        </button>

        <button class="nav-btn" onclick="goForward()" style="transform: rotate(180deg);">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                <path d="M73.4 297.4C60.9 309.9 60.9 330.2 73.4 342.7L233.4 502.7C245.9 515.2 266.2 515.2 278.7 502.7C291.2 490.2 291.2 469.9 278.7 457.4L173.3 352L544 352C561.7 352 576 337.7 576 320C576 302.3 561.7 288 544 288L173.3 288L278.7 182.6C291.2 170.1 291.2 149.8 278.7 137.3C266.2 124.8 245.9 124.8 233.4 137.3L73.4 297.3z"/>
            </svg>
        </button>

        <button class="nav-btn" onclick="refreshTab()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                <path d="M129.9 292.5C143.2 199.5 223.3 128 320 128C373 128 421 149.5 455.8 184.2L464 192L416.1 192C398.4 192 384.1 206.3 384.1 224C384.1 241.7 398.4 256 416.1 256L544.1 256C561.8 256 576.1 241.7 576.1 224L576.1 96C576.1 78.3 561.8 64 544.1 64C526.4 64 512.1 78.3 512.1 96L512.1 149.4L500.8 138.7C454.5 92.6 390.5 64 320 64C191 64 84.3 159.4 66.6 283.5C64.1 301 76.2 317.2 93.7 319.7C111.2 322.2 127.4 310 129.9 292.6z"/>
            </svg>
        </button>

        <div class="address-bar">

            <div class="lock-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                    <path d="M144 144V112C144 76.7 172.7 48 208 48H240C275.3 48 304 76.7 304 112V144H144z"/>
                </svg>
            </div>

            <input type="text" id="bar">

        </div>

    </div>

    <div class="bookmarks-bar" id="bookmarks-bar"></div>

    <div id="viewport-container"></div>

    <script>
        const tabBar = document.getElementById("tab-bar");
        const bar = document.getElementById("bar");
        const viewportContainer = document.getElementById("viewport-container");
        const bookmarksBar = document.getElementById("bookmarks-bar");

        let tabs = [];
        let activeTabId = null;

        navigator.serviceWorker.register("/sail/sw.js");

        const connection =
            new BareMux.BareMuxConnection(
                "/sail/baremux/worker.js"
            );

        async function applyTransport() {
            await connection.setTransport(
                "/sail/libcurl/index.mjs",
                [
                    {
                        websocket:
                            "wss://wisp.classroom.lat/"
                    }
                ]
            );
        }

        applyTransport();

        const { ScramjetController } =
            $scramjetLoadController();

        const scramjet =
            new ScramjetController({
                files: {
                    all: "/sail/scram/scramjet.all.js",
                    wasm: "/sail/scram/scramjet.wasm.wasm",
                    sync: "/sail/scram/scramjet.sync.js"
                },
                prefix: "/sail/go/"
            });

        scramjet.init();

        const defaultBookmarks = [
            {
                name: "Google",
                url: "https://google.com"
            },
            {
                name: "YouTube",
                url: "https://youtube.com"
            },
            {
                name: "Discord",
                url: "https://discord.com/app"
            },
            {
                name: "GitHub",
                url: "https://github.com"
            }
        ];

        let bookmarks =
            JSON.parse(
                localStorage.getItem(
                    "proxy-bookmarks"
                )
            ) || defaultBookmarks;

        function saveBookmarks() {

            localStorage.setItem(
                "proxy-bookmarks",
                JSON.stringify(bookmarks)
            );

            renderBookmarks();
        }

        function renderBookmarks() {

            bookmarksBar.innerHTML = "";

            bookmarks.forEach((bookmark, index) => {

                const wrap =
                    document.createElement("div");

                wrap.className =
                    "bookmark-wrap";

                wrap.innerHTML = `
                    <a class="bookmark"
                       href="javascript:void(0)">
                        ${bookmark.name}
                    </a>

                    <button class="bookmark-remove">
                        ×
                    </button>
                `;

                wrap.querySelector(".bookmark")
                    .onclick = () => {
                        quickNav(bookmark.url);
                    };

                wrap.querySelector(
                    ".bookmark-remove"
                ).onclick = (e) => {

                    e.stopPropagation();

                    bookmarks.splice(index, 1);

                    saveBookmarks();
                };

                bookmarksBar.appendChild(wrap);
            });

            const addBtn =
                document.createElement("button");

            addBtn.className =
                "add-bookmark-btn";

            addBtn.textContent = "+ Add";

            addBtn.onclick = () => {

                const name =
                    prompt("Bookmark name:");

                if (!name) return;

                const url =
                    prompt("Bookmark URL:");

                if (!url) return;

                bookmarks.push({
                    name,
                    url
                });

                saveBookmarks();
            };

            bookmarksBar.appendChild(addBtn);
        }

        function getNewTabPage() {
            return "https://math-hub.pages.dev/newtab/";
        }

        function formatUrl(url) {

            if (!url) return "";

            if (
                !url.startsWith("http://") &&
                !url.startsWith("https://")
            ) {

                if (url.includes(".")) {
                    return "https://" + url;
                }

                return (
                    "https://duckduckgo.com/?q=" +
                    encodeURIComponent(url)
                );
            }

            return url;
        }

        function addTab(url = "bloxcraft://newtab") {

            const id =
                "tab-" + crypto.randomUUID();

            const tabObj = {
                id,
                title: "New Tab",
                url
            };

            tabs.push(tabObj);

            const tabEl =
                document.createElement("div");

            tabEl.className = "tab";
            tabEl.id = "btn-" + id;

            tabEl.innerHTML = `
                <div class="tab-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                        <path d="M320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576C461.4 576 576 461.4 576 320C576 178.6 461.4 64 320 64z"/>
                    </svg>
                </div>

                <span class="tab-title">
                    New Tab
                </span>

                <div class="tab-close">
                    ×
                </div>
            `;

            tabEl.onclick = () => switchTab(id);

            tabEl
                .querySelector(".tab-close")
                .onclick = (e) => {
                    closeTab(e, id);
                };

            tabBar.insertBefore(
                tabEl,
                document.querySelector(".new-tab-btn")
            );

            const iframe =
                document.createElement("iframe");

            iframe.id = "frame-" + id;

            if (url === "bloxcraft://newtab") {

                iframe.src =
                    "/sail/go/" +
                    scramjet.encodeUrl(
                        getNewTabPage()
                    );

            } else {

                iframe.src =
                    "/sail/go/" +
                    scramjet.encodeUrl(
                        formatUrl(url)
                    );
            }

            iframe.addEventListener(
                "load",
                () => {

                    try {

                        const current =
                            iframe.contentWindow
                            ?.location?.href;

                        if (
                            current &&
                            current.includes(
                                "/sail/go/"
                            )
                        ) {

                            const encoded =
                                current.split(
                                    "/sail/go/"
                                )[1];

                            const decoded =
                                decodeURIComponent(
                                    encoded
                                );

                            const tab =
                                tabs.find(
                                    t => t.id === id
                                );

                            if (tab) {

                                tab.url =
                                    decoded;

                                if (
                                    activeTabId === id
                                ) {

                                    bar.value =
                                        decoded;

                                    history.replaceState(
                                        {},
                                        "",
                                        "/?url=" +
                                        encodeURIComponent(
                                            decoded
                                        )
                                    );
                                }
                            }
                        }

                    } catch {}

                    updateTabTitle(id);
                }
            );

            viewportContainer.appendChild(
                iframe
            );

            switchTab(id);
        }

        function switchTab(id) {

            activeTabId = id;

            tabs.forEach(tab => {

                const btn =
                    document.getElementById(
                        "btn-" + tab.id
                    );

                const frame =
                    document.getElementById(
                        "frame-" + tab.id
                    );

                const active =
                    tab.id === id;

                btn.classList.toggle(
                    "active",
                    active
                );

                frame.classList.toggle(
                    "active",
                    active
                );

                if (active) {

                    let visibleUrl =
                        tab.url;

                    try {

                        const current =
                            frame.contentWindow
                            ?.location?.href;

                        if (
                            current &&
                            current.includes(
                                "/sail/go/"
                            )
                        ) {

                            const encoded =
                                current.split(
                                    "/sail/go/"
                                )[1];

                            visibleUrl =
                                decodeURIComponent(
                                    encoded
                                );

                            tab.url =
                                visibleUrl;
                        }

                    } catch {}

                    bar.value = visibleUrl;

                    history.replaceState(
                        {},
                        "",
                        "/?url=" +
                        encodeURIComponent(
                            visibleUrl
                        )
                    );
                }
            });
        }

        function closeTab(event, id) {

            event.stopPropagation();

            if (tabs.length === 1) return;

            const index =
                tabs.findIndex(
                    t => t.id === id
                );

            document
                .getElementById("btn-" + id)
                ?.remove();

            document
                .getElementById("frame-" + id)
                ?.remove();

            tabs.splice(index, 1);

            if (activeTabId === id) {

                const next =
                    tabs[index] ||
                    tabs[index - 1];

                if (next) {
                    switchTab(next.id);
                }
            }
        }

        function nav() {

            if (!activeTabId) return;

            const value =
                bar.value.trim();

            if (!value) return;

            const formatted =
                value === "bloxcraft://newtab"
                    ? "bloxcraft://newtab"
                    : formatUrl(value);

            const tab =
                tabs.find(
                    t => t.id === activeTabId
                );

            tab.url = formatted;

            const frame =
                document.getElementById(
                    "frame-" + activeTabId
                );

            if (
                formatted ===
                "bloxcraft://newtab"
            ) {

                frame.src =
                    "/sail/go/" +
                    scramjet.encodeUrl(
                        getNewTabPage()
                    );

            } else {

                frame.src =
                    "/sail/go/" +
                    scramjet.encodeUrl(
                        formatted
                    );
            }

            updateTabTitle(
                activeTabId,
                formatted
            );
        }

        function updateTabTitle(
            id,
            fallback = "Loading..."
        ) {

            const tab =
                tabs.find(
                    t => t.id === id
                );

            let title = fallback;

            if (
                tab.url ===
                "bloxcraft://newtab"
            ) {

                title = "Bloxcraft - New Tab";

            } else {

                try {

                    title =
                        new URL(
                            tab.url
                        ).hostname;

                } catch {

                    title = fallback;

                }
            }

            document.querySelector(
                `#btn-${id} .tab-title`
            ).textContent = title;
        }

        function goBack() {

            if (!activeTabId) return;

            document
                .getElementById(
                    "frame-" + activeTabId
                )
                ?.contentWindow
                ?.history
                ?.back();
        }

        function goForward() {

            if (!activeTabId) return;

            document
                .getElementById(
                    "frame-" + activeTabId
                )
                ?.contentWindow
                ?.history
                ?.forward();
        }

        function refreshTab() {

            if (!activeTabId) return;

            document
                .getElementById(
                    "frame-" + activeTabId
                )
                ?.contentWindow
                ?.location
                ?.reload();
        }

        function quickNav(url) {
            bar.value = url;
            nav();
        }

        bar.addEventListener(
            "keydown",
            (e) => {

                if (e.key === "Enter") {
                    nav();
                }
            }
        );

        renderBookmarks();

        const params =
            new URLSearchParams(
                location.search
            );

        const launchUrl =
            params.get("url");

        window.addEventListener(
            "load",
            () => {

                if (launchUrl) {

                    addTab(launchUrl);

                } else {

                    addTab(
                        "bloxcraft://newtab"
                    );
                }
            }
        );
    </script>

</body>

</html>
