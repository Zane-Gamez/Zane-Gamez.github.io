<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxProxy</title>

    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js"></script>

    <style>
        * { box-sizing: border-box; }

        :root {
            --bg: #000;
            --toolbar: #0d0d0d;
            --tab: #0f0f0f;
            --tab-hover: #1b1b1b;
            --border: #1f1f1f;
            --text: #fff;
        }

        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tab-bar {
            height: 36px;
            background: var(--toolbar);
            display: flex;
            align-items: flex-end;
            padding: 0 8px;
            gap: 6px;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            height: 34px;
            min-width: 190px;
            background: var(--tab);
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            cursor: pointer;
        }

        .tab.active { background: #111; }

        .tab-title {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        .tab-close {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .tab-close:hover { background: rgba(255,255,255,0.1); }

        .navbar {
            height: 52px;
            background: black;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
        }

        .nav-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
        }

        .address-bar {
            flex: 1;
            height: 34px;
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 12px;
        }

        #bar {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
        }

        #viewport-container {
            flex: 1;
            position: relative;
            background: black;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active { display: block; }
    </style>
</head>

<body>

    <div class="tab-bar" id="tab-bar">
        <button onclick="addTab()">+</button>
    </div>

    <div class="navbar">
        <div class="address-bar">
            <input id="bar" type="text">
        </div>
    </div>

    <div id="viewport-container"></div>

    <script>
        const tabBar = document.getElementById("tab-bar");
        const bar = document.getElementById("bar");
        const viewportContainer = document.getElementById("viewport-container");

        let tabs = [];
        let activeTabId = null;

        function decodeProxiedUrl(url) {
            if (!url) return "";

            try {
                if (url.includes("/sail/go/")) {
                    let raw = url.split("/sail/go/")[1] || "";

                    for (let i = 0; i < 3; i++) {
                        try {
                            const next = decodeURIComponent(raw);
                            if (next === raw) break;
                            raw = next;
                        } catch {
                            break;
                        }
                    }

                    return raw;
                }

                return url;
            } catch {
                return url;
            }
        }

        function addTab(url = "https://math-hub.pages.dev/newtab/") {
            const id = "tab-" + crypto.randomUUID();

            const tab = { id, url };
            tabs.push(tab);

            const el = document.createElement("div");
            el.className = "tab";
            el.id = "btn-" + id;

            el.innerHTML = `
                <div class="tab-title">New Tab</div>
                <div class="tab-close">×</div>
            `;

            el.onclick = () => switchTab(id);
            el.querySelector(".tab-close").onclick = (e) => closeTab(e, id);

            tabBar.appendChild(el);

            const frame = document.createElement("iframe");
            frame.id = "frame-" + id;

            frame.src = url;
            viewportContainer.appendChild(frame);

            switchTab(id);
        }

        function switchTab(id) {
            activeTabId = id;

            tabs.forEach(t => {
                const btn = document.getElementById("btn-" + t.id);
                const frame = document.getElementById("frame-" + t.id);

                const active = t.id === id;

                btn.classList.toggle("active", active);
                frame.classList.toggle("active", active);
            });

            syncBar();
        }

        function syncBar() {
            const frame = document.getElementById("frame-" + activeTabId);
            if (!frame) return;

            let liveUrl = "";

            try {
                liveUrl =
                    frame.contentWindow.location.href ||
                    frame.src;
            } catch {
                liveUrl = frame.src;
            }

            bar.value = decodeProxiedUrl(liveUrl);
        }

        function nav() {
            const tab = tabs.find(t => t.id === activeTabId);
            if (!tab) return;

            const frame = document.getElementById("frame-" + activeTabId);

            let url = bar.value;

            if (!url.startsWith("http")) {
                url = "https://" + url;
            }

            tab.url = url;
            frame.src = url;

            setTimeout(syncBar, 300);
        }

        function closeTab(e, id) {
            e.stopPropagation();

            document.getElementById("btn-" + id)?.remove();
            document.getElementById("frame-" + id)?.remove();

            tabs = tabs.filter(t => t.id !== id);

            if (activeTabId === id && tabs.length) {
                switchTab(tabs[0].id);
            }
        }

        bar.addEventListener("keydown", e => {
            if (e.key === "Enter") nav();
        });

        setInterval(syncBar, 400);

        addTab("https://math-hub.pages.dev/newtab/");
    </script>

</body>
</html>
