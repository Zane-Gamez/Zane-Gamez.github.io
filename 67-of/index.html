<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BloxProxy</title>

    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #0f1724;
            --toolbar: #17212f;
            --toolbar-light: #1e2b3d;
            --tab: #202d40;
            --tab-hover: #2a3a52;
            --active: #4c8dff;
            --border: #31445f;
            --text: #ffffff;
            --muted: #9fb3ca;
            --input: #101826;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: linear-gradient(to bottom, #1d2b3d, #162232);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .tab-bar {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            padding: 8px 10px 0;
            overflow-x: auto;
            scrollbar-width: none;
            min-height: 42px;
        }

        .tab-bar::-webkit-scrollbar {
            display: none;
        }

        .chrome-btn {
            background: var(--toolbar-light);
            border: 1px solid var(--border);
            color: white;
            height: 34px;
            min-width: 34px;
            border-radius: 10px;
            cursor: pointer;
            transition: .18s;
            font-size: 15px;
        }

        .chrome-btn:hover {
            background: var(--tab-hover);
        }

        .home-btn {
            text-decoration: none;
            color: var(--muted);
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 14px;
            height: 34px;
            border-radius: 10px;
            background: var(--toolbar-light);
            border: 1px solid var(--border);
            transition: .18s;
            white-space: nowrap;
        }

        .home-btn:hover {
            background: var(--tab-hover);
            color: white;
        }

        .tab {
            height: 38px;
            min-width: 170px;
            max-width: 230px;
            border-radius: 12px 12px 0 0;
            background: var(--tab);
            border: 1px solid transparent;
            border-bottom: none;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
            cursor: pointer;
            transition: .18s;
            user-select: none;
            position: relative;
            color: var(--muted);
        }

        .tab:hover {
            background: var(--tab-hover);
            color: white;
        }

        .tab.active {
            background: linear-gradient(to bottom, #5c9dff, #4c8dff);
            color: white;
            box-shadow: 0 4px 18px rgba(76, 141, 255, .35);
        }

        .tab-title {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 13px;
            font-weight: 500;
        }

        .tab-close {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .15s;
            font-size: 14px;
        }

        .tab-close:hover {
            background: rgba(255, 255, 255, .15);
            color: #ff7d7d;
        }

        .spacer {
            flex: 1;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: var(--toolbar);
        }

        .nav-btn {
            height: 38px;
            min-width: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--toolbar-light);
            color: white;
            cursor: pointer;
            transition: .18s;
            font-size: 15px;
        }

        .nav-btn:hover {
            background: var(--tab-hover);
        }

        .address-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0 14px;
            height: 42px;
        }

        .address-wrap:focus-within {
            border-color: var(--active);
            box-shadow: 0 0 0 3px rgba(76, 141, 255, .15);
        }

        #bar {
            flex: 1;
            height: 100%;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 14px;
        }

        #bar::placeholder {
            color: #7d91a8;
        }

        .go-btn {
            background: linear-gradient(to bottom, #5c9dff, #4c8dff);
            border: none;
            color: white;
            height: 38px;
            padding: 0 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        .go-btn:hover {
            background: linear-gradient(to bottom, #72acff, #5a98ff);
        }

        #viewport-container {
            flex: 1;
            position: relative;
            background: black;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            background: black;
        }

        iframe.active {
            display: block;
        }

        .settings-panel {
            position: fixed;
            top: 60px;
            right: 14px;
            width: 340px;
            background: #162232;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px;
            z-index: 9999;
            display: none;
        }

        .settings-panel.open {
            display: block;
        }

        .settings-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .settings-group {
            margin-bottom: 16px;
        }

        .settings-label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--muted);
        }

        .settings-select,
        .settings-input {
            width: 100%;
            background: #101826;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 12px;
            outline: none;
        }

        #custom-ws-group {
            display: none;
        }

        .settings-save {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(to bottom, #5c9dff, #4c8dff);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .settings-save:hover {
            background: linear-gradient(to bottom, #72acff, #5a98ff);
        }
    </style>
</head>

<body>

    <div class="topbar">

        <div class="tab-bar" id="tab-bar">

            <a href="/porxy-selector" class="home-btn">
                Select Proxy
            </a>

            <button class="chrome-btn" onclick="addTab()">+</button>

            <div class="spacer"></div>

            <button class="chrome-btn" onclick="toggleSettings()">⚙</button>

        </div>

        <div class="nav-bar">

            <button class="nav-btn" onclick="goBack()">←</button>

            <button class="nav-btn" onclick="goForward()">→</button>

            <div class="address-wrap">
                <input type="text" id="bar" placeholder="Search Google or type a URL">
            </div>

            <button class="go-btn" onclick="nav()">Go</button>

        </div>

    </div>

    <div id="viewport-container"></div>

    <div class="settings-panel" id="settings-panel">

        <div class="settings-title">
            Settings
        </div>

        <div class="settings-group">
            <label class="settings-label">
                Wisp WebSocket Server
            </label>

            <select id="ws-select" class="settings-select">
                <option value="default">wss://wisp.classroom.lat/</option>
                <option value="wss://echo.websocket.events">wss://echo.websocket.events/</option>
                <option value="wss://ws.ifelse.io">wss://ws.ifelse.io/</option>
                <option value="custom">Custom</option>
            </select>
        </div>

        <div class="settings-group" id="custom-ws-group">

            <label class="settings-label">
                Custom Wisp Server
            </label>

            <input type="text"
                id="custom-ws"
                class="settings-input"
                placeholder="wss://example.com/wisp/">

        </div>

        <button class="settings-save" onclick="saveSettings()">
            Save Settings
        </button>

    </div>

    <script>
        const tabBar = document.getElementById("tab-bar");
        const bar = document.getElementById("bar");
        const viewportContainer = document.getElementById("viewport-container");

        const wsSelect = document.getElementById("ws-select");
        const customWsGroup = document.getElementById("custom-ws-group");
        const customWsInput = document.getElementById("custom-ws");

        let tabs = [];
        let activeTabId = null;

        const defaultWs = "wss://wisp.classroom.lat/";

        let currentWs =
            localStorage.getItem("proxy-ws") ||
            defaultWs;

        navigator.serviceWorker.register("/sail/sw.js");

        const connection =
            new BareMux.BareMuxConnection(
                "/sail/baremux/worker.js"
            );

        async function applyTransport() {
            await connection.setTransport(
                "/sail/libcurl/index.mjs",
                [
                    {
                        websocket: currentWs
                    }
                ]
            );
        }

        applyTransport();

        const { ScramjetController } =
            $scramjetLoadController();

        const scramjet = new ScramjetController({
            files: {
                all: "/sail/scram/scramjet.all.js",
                wasm: "/sail/scram/scramjet.wasm.wasm",
                sync: "/sail/scram/scramjet.sync.js"
            },
            prefix: "/sail/go/"
        });

        scramjet.init();

        function updateCustomWsVisibility() {
            if (wsSelect.value === "custom") {
                customWsGroup.style.display = "block";
            } else {
                customWsGroup.style.display = "none";
            }
        }

        wsSelect.addEventListener(
            "change",
            updateCustomWsVisibility
        );

        function toggleSettings() {
            document
                .getElementById("settings-panel")
                .classList
                .toggle("open");
        }

        function saveSettings() {
            const selected = wsSelect.value;
            const custom =
                customWsInput.value.trim();

            if (selected === "default") {
                currentWs = defaultWs;
            } else if (selected === "custom") {
                if (!custom) return;
                currentWs = custom;
            } else {
                currentWs = selected;
            }

            localStorage.setItem(
                "proxy-ws",
                currentWs
            );

            applyTransport();

            toggleSettings();
        }

        function getNewTabPage() {
            return scramjet.encodeUrl(
                "https://math-hub.pages.dev/newtab/"
            );
        }

        function addTab(url = "internal:newtab") {

            const id =
                "tab-" + crypto.randomUUID();

            const tabObj = {
                id,
                title: "New Tab",
                url
            };

            tabs.push(tabObj);

            const tabEl =
                document.createElement("div");

            tabEl.className = "tab";
            tabEl.id = "btn-" + id;

            tabEl.innerHTML = `
                <span class="tab-title">
                    New Tab
                </span>

                <span class="tab-close">
                    ×
                </span>
            `;

            tabEl.onclick = () => switchTab(id);

            tabEl
                .querySelector(".tab-close")
                .onclick = (e) => {
                    closeTab(e, id);
                };

            tabBar.insertBefore(
                tabEl,
                document.querySelector(".spacer")
            );

            const iframe =
                document.createElement("iframe");

            iframe.id = "frame-" + id;

            if (url === "internal:newtab") {
                iframe.src = getNewTabPage();
            } else {
                iframe.src =
                    scramjet.encodeUrl(
                        formatUrl(url)
                    );
            }

            iframe.addEventListener(
                "load",
                () => {
                    updateTabTitle(id);
                }
            );

            viewportContainer.appendChild(
                iframe
            );

            switchTab(id);
        }

        function switchTab(id) {

            activeTabId = id;

            tabs.forEach(tab => {

                const btn =
                    document.getElementById(
                        "btn-" + tab.id
                    );

                const frame =
                    document.getElementById(
                        "frame-" + tab.id
                    );

                const active =
                    tab.id === id;

                btn.classList.toggle(
                    "active",
                    active
                );

                frame.classList.toggle(
                    "active",
                    active
                );

                if (active) {
                    bar.value =
                        tab.url ===
                            "internal:newtab"
                            ? ""
                            : tab.url;
                }
            });
        }

        function closeTab(event, id) {

            event.stopPropagation();

            if (tabs.length === 1) return;

            const index =
                tabs.findIndex(
                    t => t.id === id
                );

            document
                .getElementById("btn-" + id)
                ?.remove();

            document
                .getElementById("frame-" + id)
                ?.remove();

            tabs.splice(index, 1);

            if (activeTabId === id) {

                const next =
                    tabs[index] ||
                    tabs[index - 1];

                if (next) {
                    switchTab(next.id);
                }
            }
        }

        function formatUrl(url) {

            if (!url) return "";

            if (
                !url.startsWith("http://") &&
                !url.startsWith("https://")
            ) {

                if (url.includes(".")) {
                    return "https://" + url;
                }

                return (
                    "https://duckduckgo.com/?q=" +
                    encodeURIComponent(url)
                );
            }

            return url;
        }

        function nav() {

            if (!activeTabId) return;

            const value =
                bar.value.trim();

            if (!value) return;

            const formatted =
                formatUrl(value);

            const tab =
                tabs.find(
                    t => t.id === activeTabId
                );

            tab.url = formatted;

            const frame =
                document.getElementById(
                    "frame-" + activeTabId
                );

            frame.src =
                scramjet.encodeUrl(
                    formatted
                );

            updateTabTitle(
                activeTabId,
                formatted
            );
        }

        function updateTabTitle(
            id,
            fallback = "Loading..."
        ) {

            const frame =
                document.getElementById(
                    "frame-" + id
                );

            let title = fallback;

            try {

                title =
                    frame.contentDocument
                        ?.title ||

                    new URL(
                        tabs.find(
                            t => t.id === id
                        )?.url || ""
                    ).hostname ||

                    fallback;

            } catch {

                try {

                    title =
                        new URL(
                            tabs.find(
                                t => t.id === id
                            )?.url || ""
                        ).hostname;

                } catch {

                    title = fallback;

                }
            }

            document.querySelector(
                `#btn-${id} .tab-title`
            ).textContent = title;
        }

        function goBack() {

            if (!activeTabId) return;

            document
                .getElementById(
                    "frame-" + activeTabId
                )
                ?.contentWindow
                ?.history
                ?.back();
        }

        function goForward() {

            if (!activeTabId) return;

            document
                .getElementById(
                    "frame-" + activeTabId
                )
                ?.contentWindow
                ?.history
                ?.forward();
        }

        bar.addEventListener(
            "keydown",
            (e) => {

                if (e.key === "Enter") {
                    nav();
                }
            }
        );

        window.addEventListener(
            "load",
            () => {

                updateCustomWsVisibility();

                const params =
                    new URLSearchParams(
                        location.search
                    );

                const go =
                    params.get("go");

                addTab(
                    go ||
                    "internal:newtab"
                );
            }
        );
    </script>

</body>

</html>
