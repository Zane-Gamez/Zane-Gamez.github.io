<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxProxy</title>

    <script src="/sail/baremux/index.js"></script>
    <script src="/sail/scram/scramjet.all.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #000000;
            --toolbar: #0d0d0d;
            --tab: #0f0f0f;
            --tab-hover: #1b1b1b;
            --border: #1f1f1f;
            --text: #ffffff;
        }

        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tab-bar {
            height: 36px;
            background: var(--toolbar);
            display: flex;
            align-items: flex-end;
            padding: 0 8px;
            gap: 6px;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            height: 34px;
            min-width: 190px;
            background: var(--tab);
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            cursor: pointer;
        }

        .tab.active {
            background: #111;
        }

        .tab-title {
            flex: 1;
            font-size: 13px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .tab-close {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .new-tab-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .navbar {
            height: 52px;
            background: black;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
        }

        .nav-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
        }

        .address-bar {
            flex: 1;
            height: 34px;
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 12px;
        }

        #bar {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
        }

        .bookmarks-bar {
            height: 30px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 10px;
            border-bottom: 1px solid #1f1f1f;
        }

        .bookmark {
            color: #ccc;
            font-size: 13px;
            cursor: pointer;
        }

        .bookmark-remove {
            margin-left: 4px;
            cursor: pointer;
            color: #888;
        }

        #viewport-container {
            flex: 1;
            position: relative;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }

        .settings-panel {
            position: fixed;
            top: 50px;
            right: 10px;
            width: 320px;
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 16px;
            display: none;
            z-index: 9999;
        }

        .settings-panel.open {
            display: block;
        }

        .settings-title {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .settings-label {
            font-size: 13px;
            color: #aaa;
            display: block;
            margin-bottom: 6px;
        }

        .settings-select,
        .settings-input {
            width: 100%;
            height: 40px;
            background: #0b0b0b;
            border: 1px solid #222;
            border-radius: 8px;
            color: white;
            margin-bottom: 12px;
            padding: 0 10px;
        }

        #custom-ws-group {
            display: none;
        }

        .settings-save {
            width: 100%;
            height: 42px;
            border: none;
            background: white;
            color: black;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="tab-bar" id="tab-bar">
        <button class="new-tab-btn" onclick="addTab()">+</button>
    </div>

    <div class="navbar">

        <button class="nav-btn" onclick="goBack()">←</button>
        <button class="nav-btn" onclick="goForward()">→</button>
        <button class="nav-btn" onclick="refreshTab()">⟳</button>

        <div class="address-bar">
            <input id="bar" placeholder="Search or enter URL">
        </div>

        <button class="nav-btn" onclick="toggleSettings()">⚙</button>

    </div>

    <div class="bookmarks-bar" id="bookmarks-bar"></div>

    <div id="viewport-container"></div>


    <div class="settings-panel" id="settings-panel">

        <div class="settings-title">Settings</div>

        <label class="settings-label">Wisp Server</label>

        <select id="ws-select" class="settings-select">

            <option value="wss://wisp.classroom.lat/">
                classroom.lat (default)
            </option>

            <option value="wss://anura.pro/">
                anura.pro
            </option>

            <option value="wss://wisp.mercurywork.shop/">
                mercurywork.shop
            </option>

            <option value="wss://wisp.proxyium.com/">
                proxyium.com
            </option>

            <option value="wss://wisp.rhw.one/">
                rhw.one
            </option>

            <option value="custom">
                custom
            </option>

        </select>

        <div id="custom-ws-group">
            <label class="settings-label">Custom Wisp</label>
            <input id="custom-ws" class="settings-input" placeholder="wss://example.com/">
        </div>

        <button class="settings-save" onclick="saveSettings()">Save</button>

    </div>

<script>
const tabBar = document.getElementById("tab-bar");
const bar = document.getElementById("bar");
const viewport = document.getElementById("viewport-container");

const wsSelect = document.getElementById("ws-select");
const customWsGroup = document.getElementById("custom-ws-group");
const customWsInput = document.getElementById("custom-ws");

const bookmarksBar = document.getElementById("bookmarks-bar");

let tabs = [];
let activeTabId = null;

const defaultWs = "wss://wisp.classroom.lat/";
let currentWs = localStorage.getItem("proxy-ws") || defaultWs;


navigator.serviceWorker.register("/sail/sw.js");


const connection = new BareMux.BareMuxConnection("/sail/baremux/worker.js");

async function applyTransport() {
    await connection.setTransport("/sail/libcurl/index.mjs", [
        { websocket: currentWs }
    ]);
}
applyTransport();


const { ScramjetController } = $scramjetLoadController();

const scramjet = new ScramjetController({
    files: {
        all: "/sail/scram/scramjet.all.js",
        wasm: "/sail/scram/scramjet.wasm.wasm",
        sync: "/sail/scram/scramjet.sync.js"
    },
    prefix: "/sail/go/"
});

scramjet.init();


function toggleSettings() {
    document.getElementById("settings-panel").classList.toggle("open");
}

function updateCustomWsVisibility() {
    customWsGroup.style.display = wsSelect.value === "custom" ? "block" : "none";
}

wsSelect.addEventListener("change", updateCustomWsVisibility);

async function saveSettings() {

    if (wsSelect.value === "custom") {
        const v = customWsInput.value.trim();
        if (!v) return;
        currentWs = v;
    } else {
        currentWs = wsSelect.value;
    }

    localStorage.setItem("proxy-ws", currentWs);

    await applyTransport();

    toggleSettings();
}

=
const defaultBookmarks = [
    { name: "Google", url: "https://google.com" },
    { name: "YouTube", url: "https://youtube.com" },
    { name: "Discord", url: "https://discord.com/app" },
    { name: "GitHub", url: "https://github.com" }
];

let bookmarks = JSON.parse(localStorage.getItem("proxy-bookmarks")) || defaultBookmarks;

function saveBookmarks() {
    localStorage.setItem("proxy-bookmarks", JSON.stringify(bookmarks));
    renderBookmarks();
}

function renderBookmarks() {

    bookmarksBar.innerHTML = "";

    bookmarks.forEach((b, i) => {

        const el = document.createElement("div");
        el.innerHTML = `
            <span class="bookmark">${b.name}</span>
            <span class="bookmark-remove">×</span>
        `;

        el.querySelector(".bookmark").onclick = () => quickNav(b.url);

        el.querySelector(".bookmark-remove").onclick = () => {
            bookmarks.splice(i, 1);
            saveBookmarks();
        };

        bookmarksBar.appendChild(el);
    });

    const add = document.createElement("span");
    add.textContent = "+ add";
    add.className = "bookmark";
    add.onclick = () => {
        const name = prompt("name");
        const url = prompt("url");
        if (!name || !url) return;
        bookmarks.push({ name, url });
        saveBookmarks();
    };

    bookmarksBar.appendChild(add);
}


function formatUrl(u) {
    if (!u) return "";
    if (!u.startsWith("http")) {
        if (u.includes(".")) return "https://" + u;
        return "https://duckduckgo.com/?q=" + encodeURIComponent(u);
    }
    return u;
}

function addTab(url = "bloxcraft://newtab") {

    const id = "t-" + crypto.randomUUID();

    const iframe = document.createElement("iframe");
    iframe.id = id;

    iframe.src =
        "/sail/go/" +
        scramjet.encodeUrl(
            url === "bloxcraft://newtab"
                ? "https://math-hub.pages.dev/newtab/"
                : formatUrl(url)
        );

    viewport.appendChild(iframe);

    const tab = document.createElement("div");
    tab.className = "tab";
    tab.innerHTML = `<div class="tab-title">New Tab</div><div class="tab-close">x</div>`;

    tab.onclick = () => switchTab(id);

    tab.querySelector(".tab-close").onclick = (e) => {
        e.stopPropagation();
        iframe.remove();
        tab.remove();
    };

    tabBar.appendChild(tab);

    switchTab(id);
}

function switchTab(id) {

    activeTabId = id;

    document.querySelectorAll("iframe").forEach(f => f.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function quickNav(url) {
    bar.value = url;
    nav();
}

function nav() {
    const iframe = document.getElementById(activeTabId);
    iframe.src = "/sail/go/" + scramjet.encodeUrl(formatUrl(bar.value));
}


function goBack() {
    document.getElementById(activeTabId)?.contentWindow.history.back();
}

function goForward() {
    document.getElementById(activeTabId)?.contentWindow.history.forward();
}

function refreshTab() {
    document.getElementById(activeTabId)?.contentWindow.location.reload();
}

bar.addEventListener("keydown", e => {
    if (e.key === "Enter") nav();
});


window.addEventListener("load", async () => {

    renderBookmarks();
    updateCustomWsVisibility();

    await applyTransport(); 

    addTab("bloxcraft://newtab");
});
</script>

</body>
</html>
